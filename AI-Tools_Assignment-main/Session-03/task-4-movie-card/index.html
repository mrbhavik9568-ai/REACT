<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie Card</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="page">

        <h1 class="page-title">
            Recommended Movies
        </h1>

        <div class="movie-card">

            <!-- Movie Poster -->
            <div class="poster-container">

                <img
                    src="https://dummyimage.com/300x450/222/ffffff&text=MOVIE+POSTER"
                    alt="Movie Poster"
                    class="movie-poster"
                >

            </div>


            <!-- Movie Information -->
            <div class="movie-info">

                <h2 class="movie-title">
                    Avengers: Endgame
                </h2>

                <p class="movie-details">
                    English • Action • Adventure
                </p>


                <!-- Rating -->
                <div class="movie-rating">

                    <span class="star">
                        ★
                    </span>

                    <span>
                        4.5/5
                    </span>

                </div>


                <!-- Description -->
                <p class="movie-description">
                    Earth's mightiest heroes come together
                    for an epic battle to save the universe.
                </p>


                <!-- Book Button -->
                <button class="book-button">
                    Book Now
                </button>

            </div>

        </div>

    </main>

</body>

</html>
